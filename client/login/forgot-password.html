 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AgroConnect Zambia</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            font-family: Arial, sans-serif; background: #f2f7f1;
            color: #203126;
        }
        .card {
            width: 100%; max-width: 440px; background: white;
            padding: 30px; border-radius: 16px;
            box-shadow: 0 8px 30px #173d2014;
        }
        h1 { margin-top: 0; color: #20743a; }
        p { line-height: 1.6; color: #5c6a60; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input {
            width: 100%; padding: 13px; border: 1px solid #cbd6cc;
            border-radius: 8px; font-size: 16px;
        }
        button {
            width: 100%; margin-top: 18px; padding: 13px;
            border: 0; border-radius: 8px; background: #20743a;
            color: white; font-size: 16px; cursor: pointer;
        }
        button:disabled { opacity: .65; cursor: wait; }
        #message { overflow-wrap: anywhere; }
        a { color: #20743a; }
        .back { display: inline-block; margin-top: 18px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Forgot password?</h1>
        <p>Enter the email address associated with your AgroConnect account. We'll help you reset your password.</p>

        <form id="forgotForm">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required maxlength="255"
                   placeholder="you@example.com">
            <button id="submitButton" type="submit">Request password reset</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <p id="resetLink"></p>
        <a class="back" href="/login/login.html">Back to login</a>
    </main>

    <script>
        const form = document.getElementById("forgotForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");
        const resetLink = document.getElementById("resetLink");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            button.disabled = true;
            message.textContent = "Processing your request...";
            resetLink.replaceChildren();

            try {
                const response = await fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim()
                    })
                });

                const data = await response.json();
                message.textContent = data.message || "Request completed.";

                // The backend exposes this link only outside production.
                if (data.resetUrl) {
                    const paragraph = document.createElement("p");
                    paragraph.textContent = "Local development reset link: ";

                    const link = document.createElement("a");
                    link.href = data.resetUrl;
                    link.textContent = "Reset your password";
                    paragraph.appendChild(link);
                    resetLink.appendChild(paragraph);
                }
            } catch (error) {
                message.textContent = "Could not contact the server. Please try again.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
