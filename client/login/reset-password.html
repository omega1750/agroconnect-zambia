<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AgroConnect Zambia</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            font-family: Arial, sans-serif; background: #f2f7f1;
            color: #203126;
        }
        .card {
            width: 100%; max-width: 440px; background: white;
            padding: 30px; border-radius: 16px;
            box-shadow: 0 8px 30px #173d2014;
        }
        h1 { margin-top: 0; color: #20743a; }
        p { line-height: 1.6; color: #5c6a60; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input {
            width: 100%; padding: 13px; border: 1px solid #cbd6cc;
            border-radius: 8px; font-size: 16px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 8px; background: #20743a;
            color: white; font-size: 16px; cursor: pointer;
        }
        button:disabled { opacity: .65; cursor: wait; }
        #message { overflow-wrap: anywhere; }
        a { color: #20743a; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Reset your password</h1>
        <p>Choose a new password for your AgroConnect account.</p>

        <form id="resetForm">
            <label for="password">New password</label>
            <input id="password" type="password" required
                   minlength="8" maxlength="72"
                   autocomplete="new-password"
                   placeholder="At least 8 characters">

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" required
                   minlength="8" maxlength="72"
                   autocomplete="new-password"
                   placeholder="Enter the password again">

            <button id="submitButton" type="submit">Reset password</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <p id="loginLink" hidden><a href="/login/login.html">Return to login</a></p>
    </main>

    <script>
        const form = document.getElementById("resetForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
            message.textContent = "This reset link is invalid. Request a new one.";
            form.hidden = true;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            message.textContent = "Resetting your password...";

            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password, confirmPassword })
                });

                const data = await response.json();
                message.textContent = data.message || "Request completed.";

                if (response.ok) {
                    form.hidden = true;
                    document.getElementById("loginLink").hidden = false;
                }
            } catch (error) {
                message.textContent = "Could not contact the server. Please try again.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
